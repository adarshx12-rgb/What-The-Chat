# Fast checks on every push / PR. The database, browser and Edge Function
# integration suites need a local Supabase (Docker) and are run by hand; see
# DEPLOYMENT.md.
name: ci
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4
      - name: Unit tests (credit math, site links, no secrets in pages)
        working-directory: tests
        run: |
          npm ci --ignore-scripts
          npm run unit
      - name: Edge Function helpers (signatures, packs, CORS)
        run: |
          deno test supabase/functions/_shared/
          deno check supabase/functions/billing/index.ts supabase/functions/razorpay-webhook/index.ts
      - name: Dependency audit (high and critical)
        run: |
          (cd tests && npm audit --audit-level=high)
          (cd server && npm audit --package-lock-only --omit=dev --audit-level=high)
